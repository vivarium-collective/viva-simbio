[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "viva-simbio"
version = "0.1.0"
description = "Process-bigraph wrapper for simbio (Chemical Reaction Network simulation)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [{name = "Eran Agmon", email = "agmon.eran@gmail.com"}]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "bigraph-schema>=0.0.60",
    "process-bigraph>=0.0.66",
    "viva-superpowers",
    "simbio>=1.1.0",
    # antimony (libantimony bindings) only ships a linux-aarch64 wheel at
    # 2.14.0 (newer releases dropped it); pin that on linux/arm64 so Docker
    # images build there, and take the latest everywhere else.
    "antimony>=2.15; platform_machine != 'aarch64' or sys_platform != 'linux'",
    "antimony==2.14.0; platform_machine == 'aarch64' and sys_platform == 'linux'",
    "python-libsbml>=5.20",
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest", "matplotlib", "plotly", "bigraph-viz"]
# Workspace dashboard stack (the `vivarium-workbench serve` CLI + report deps).
# Not needed to use the wrapper; install with `pip install viva-simbio[dashboard]`.
dashboard = [
    "vivarium-workbench",
    "bigraph-viz>=2.0.3",
    "pyyaml>=6.0",
    "jsonschema[format-nongpl]>=4.21",
    "jinja2>=3.1",
    "pypdf>=4.0",
    "matplotlib",
    "plotly",
]

[project.urls]
Homepage = "https://github.com/vivarium-collective/viva-simbio"
Issues = "https://github.com/vivarium-collective/viva-simbio/issues"

[tool.hatch.build.targets.wheel]
packages = ["viva_simbio"]

[tool.uv.sources]
# Neither is on PyPI; resolve from git so clean installs and Docker builds work
# (no local-path assumptions). viva-superpowers is required by the composite
# generators; vivarium-workbench is only needed for the optional `dashboard` extra.
viva-superpowers = { git = "https://github.com/vivarium-collective/viva-superpowers.git", branch = "main" }
vivarium-workbench = { git = "https://github.com/vivarium-collective/vivarium-workbench.git", branch = "main" }

[tool.uv]
# viva-superpowers 0.14+ and vivarium-workbench both depend on the (PyPI-absent)
# viva-basic-processes but pin it differently — viva-superpowers via a
# `[tool.uv.sources]` `branch = "main"`, vivarium-workbench via a PEP 508 direct
# reference `... @ git+...@main`. uv treats those two forms as conflicting URLs
# and fails to resolve the `dashboard` extra. A single override collapses every
# declaration to one spec so the graph resolves and the Docker wheel build runs.
override-dependencies = [
    "viva-basic-processes @ git+https://github.com/vivarium-collective/viva-basic-processes.git@main",
]
